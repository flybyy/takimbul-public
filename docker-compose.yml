services:
  db:
    image: mysql:8.0
    container_name: takimbul-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-takimbul}
      MYSQL_USER: ${DB_USERNAME:-takimbul}
      MYSQL_PASSWORD: ${DB_PASSWORD:-takimbul_local_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-takimbul_local_root_password}
      TZ: Europe/Istanbul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - takimbul_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: takimbul-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-takimbul}
      DB_USERNAME: ${DB_USERNAME:-takimbul}
      DB_PASSWORD: ${DB_PASSWORD:-takimbul_local_password}
      TAKIMBUL_ADMIN_PASSWORD: ${TAKIMBUL_ADMIN_PASSWORD:-}
      TZ: Europe/Istanbul
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - takimbul_uploads:/var/www/html/public/uploads
      - takimbul_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "php", "/var/www/html/docker/healthcheck.php"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  takimbul_db_data:
  takimbul_uploads:
  takimbul_storage:
